# base/ 폴더의 업무편람(HWP·PDF)이 바뀌면 사이트 데이터를 다시 만들어 GitHub Pages에 배포합니다.
name: 업무편람 사이트 빌드·배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 변환 도구 설치
        run: pip install pyhwp six pymupdf pillow

      - name: 업무편람 → 사이트 데이터 변환
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
